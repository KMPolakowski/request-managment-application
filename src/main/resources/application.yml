spring:
  application:
    name: request-management-application

  datasource:
    # The database is not part of the deliverable: an in-memory H2 keeps the service runnable
    # out of the box. Point these properties at a real instance to run against one.
    url: ${DATABASE_URL:jdbc:h2:mem:requests;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    open-in-view: false
    hibernate:
      # The schema belongs to Flyway; Hibernate only checks that the mapping still matches it.
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  h2:
    console:
      enabled: false

server:
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

request-management:
  api:
    default-page-size: 10
    max-page-size: 100

  publication:
    # Vendor specific; for PostgreSQL use: SELECT nextval('publication_number_seq')
    sequence-query: ${PUBLICATION_SEQUENCE_QUERY:SELECT NEXT VALUE FOR publication_number_seq}

  # The state diagram of the specification, expressed as configuration rather than as code.
  # Removing this block falls back to exactly the same lifecycle, defined in WorkflowDefinition.
  workflow:
    initial-state: CREATED
    content-editable-states:
      - CREATED
      - VERIFIED
    transitions:
      - source: CREATED
        action: VERIFY
        target: VERIFIED
      - source: CREATED
        action: DELETE
        target: DELETED
        reason-required: true
      - source: VERIFIED
        action: ACCEPT
        target: ACCEPTED
      - source: VERIFIED
        action: REJECT
        target: REJECTED
        reason-required: true
      - source: ACCEPTED
        action: REJECT
        target: REJECTED
        reason-required: true
      - source: ACCEPTED
        action: PUBLISH
        target: PUBLISHED
        assigns-publication-number: true

logging:
  level:
    com.polakowski.requestmanagement: INFO
